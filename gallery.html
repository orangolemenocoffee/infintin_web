    <script>
        const cards = Array.from(document.querySelectorAll('.card'));
        let currentIndex = 0;

        function updateCarousel() {
            cards.forEach((card, index) => {
                card.className = 'card';
                const video = card.querySelector('video');

                let relativeIndex = index - currentIndex;

                if (relativeIndex < -2) relativeIndex += cards.length;
                if (relativeIndex > 2) relativeIndex -= cards.length;

                if (relativeIndex === 0) {
                    card.classList.add('active');
                    if (video) {
                        video.currentTime = 0;
                        video.play().catch(error => console.log("Autoplay blocked/waiting for interaction:", error));
                    }
                } else {
                    if (video) video.pause(); 
                    
                    if (relativeIndex === -1) card.classList.add('left-1');
                    else if (relativeIndex === -2) card.classList.add('left-2');
                    else if (relativeIndex === 1) card.classList.add('right-1');
                    else if (relativeIndex === 2) card.classList.add('right-2');
                    else if (relativeIndex < -2) card.classList.add('hidden-left');
                    else if (relativeIndex > 2) card.classList.add('hidden-right');
                }
            });
        }

        cards.forEach((card) => {
            const video = card.querySelector('video');
            if (video) {
                video.addEventListener('ended', () => {
                    if (card.classList.contains('active')) {
                        currentIndex = (currentIndex + 1) % cards.length;
                        updateCarousel();
                    }
                });
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateCarousel();
            
            window.addEventListener('click', () => {
                const activeVideo = cards[currentIndex].querySelector('video');
                if (activeVideo && activeVideo.paused) {
                    activeVideo.play();
                }
            }, { once: true });
        });
    </script>
