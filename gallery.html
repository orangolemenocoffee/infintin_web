<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC & Automation</title>
    <link rel="stylesheet" href="./gallery.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logov1.png" alt="INFINITIN Logo">
            </div>
            <nav>
                <a href="./index.html">Home</a>
                <a href="index.html#aboutus">About Us</a>
                <a href="./hvac.html">Precision Motors for HVAC & Automation</a>
                <a href="./gallery.html" class="active">Gallery</a>
                <a href="./contact.html">Contact Us</a>
            </nav>
        </div>
    </header>

    <div class="carousel-container">
        <div class="carousel" id="carousel">
            
            <div class="card">
                <div class="video-container">
                    <video src="./img_files/vlipsy-spiderman-ha-ha-ha-lSRHMuii.mp4" muted playsinline></video>
                </div>
                <div class="info-panel">
                    <div class="title-row">
                        <h2 class="title">PRODUCT 1</h2>
                    </div>    
                </div>
            </div>

            <div class="card">
                <div class="video-container">
                    <video src="./img_files/SRM motor analysis with full ass v1.mp4" muted playsinline></video>
                </div>
                <div class="info-panel">
                    <div class="title-row">
                        <h2 class="title">PRODUCT 2</h2>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="video-container">
                    <video src=".//img_files/Website Video 1.mp4" muted playsinline></video>
                </div>
                <div class="info-panel">
                    <div class="title-row">
                        <h2 class="title">PRODUCT 3</h2>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="video-container">
                    <video src="./img_files/14804689_1080_1920_24fps.mp4" muted playsinline></video>
                </div>
                <div class="info-panel">
                    <div class="title-row">
                        <h2 class="title">PRODUCT 4</h2>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="video-container">
                    <video src="./img_files/vlipsy-the-amazing-world-of-gumball-studying-isnt-working-EqPmtBc2.mp4" muted playsinline></video>
                </div>
                <div class="info-panel">
                    <div class="title-row">
                        <h2 class="title">PRODUCT 5</h2>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const cards = Array.from(document.querySelectorAll('.card'));
        let currentIndex = 0;

        function updateCarousel() {
            cards.forEach((card, index) => {
                card.className = 'card';
                const video = card.querySelector('video');

                let relativeIndex = index - currentIndex;

                if (relativeIndex < -2) relativeIndex += cards.length;
                if (relativeIndex > 2) relativeIndex -= cards.length;

                if (relativeIndex === 0) {
                    card.classList.add('active');
                    if (video) {
                        video.currentTime = 0;
                        video.play().catch(error => console.log("Autoplay blocked/waiting for interaction:", error));
                    }
                } else {
                    if (video) video.pause(); 
                    
                    if (relativeIndex === -1) card.classList.add('left-1');
                    else if (relativeIndex === -2) card.classList.add('left-2');
                    else if (relativeIndex === 1) card.classList.add('right-1');
                    else if (relativeIndex === 2) card.classList.add('right-2');
                    else if (relativeIndex < -2) card.classList.add('hidden-left');
                    else if (relativeIndex > 2) card.classList.add('hidden-right');
                }
            });
        }

        cards.forEach((card) => {
            const video = card.querySelector('video');
            if (video) {
                video.addEventListener('ended', () => {
                    if (card.classList.contains('active')) {
                        currentIndex = (currentIndex + 1) % cards.length;
                        updateCarousel();
                    }
                });
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateCarousel();
            
            window.addEventListener('click', () => {
                const activeVideo = cards[currentIndex].querySelector('video');
                if (activeVideo && activeVideo.paused) {
                    activeVideo.play();
                }
            }, { once: true });
        });
    </script>

</body>
</html>
